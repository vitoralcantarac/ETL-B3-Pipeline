name: ETL Pipeline — Dados Financeiros B3

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3)
    # 14:00 UTC = 11:00 BRT  |  18:00 UTC = 15:00 BRT  |  21:00 UTC = 18:00 BRT
    - cron: '0 14 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache das dependências pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline
        env:
          BRAPI_TOKEN:  ${{ secrets.BRAPI_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m etl.pipeline
